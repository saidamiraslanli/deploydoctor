name: Bug report
description: Something in DeployDoctor isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please fill out the sections below — they save a round-trip.

  - type: input
    id: version
    attributes:
      label: DeployDoctor version
      description: Output of `deploydoctor version`
      placeholder: "deploydoctor 0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "Python 3.11.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command, including arguments.
      placeholder: "deploydoctor remote example.com"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the full CLI output. Redact any private hostnames.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Network notes (proxy, VPN, firewall), unusual host setup, etc.
    validations:
      required: false
