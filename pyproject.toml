[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deploydoctor"
version = "0.1.1"
description = "Diagnose Nginx, SSL, Docker, DNS, ports, and web app deployment problems from one CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Said Amiraslanli" }]
keywords = ["devops", "cli", "nginx", "ssl", "dns", "docker", "deployment", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
deploydoctor = "deploydoctor.cli:app"

[project.urls]
Homepage = "https://github.com/saidamiraslanli/deploydoctor"
Repository = "https://github.com/saidamiraslanli/deploydoctor"
Issues = "https://github.com/saidamiraslanli/deploydoctor/issues"
Changelog = "https://github.com/saidamiraslanli/deploydoctor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["deploydoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
